[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "static-rec-lab"
version = "0.1.0"
description = "static_decoding constrained decoding을 추천 시스템에 적용하는 실험용 프로젝트"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "static-rec-lab contributors" }]
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "static-decoding @ git+https://github.com/youtube/static-constraint-decoding.git@c24f9dc8b9b8045716fff7ef750a1f0cb31c6f57",
  "torch>=2.3",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "recsys"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "recsys", "scripts", "tests"]
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
